server:
  port: 8081

spring:
  application:
    name: publicaciones-service

  mongodb:
    uri: mongodb://localhost:27017/rica

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: publicaciones-service
      auto-offset-reset: earliest

  grpc:
    client:
      channel:
        investigadores:
          # Servidor gRPC de investigadores-service
          target: static://localhost:9090

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # Cada línea de log lleva el servicio y el id de correlación de la petición
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
