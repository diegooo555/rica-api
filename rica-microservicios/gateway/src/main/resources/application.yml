server:
  port: 8000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # El frontend solo conoce el Gateway; el Gateway solo conoce nombres lógicos (lb://),
          # que resuelve consultando a Eureka.
          routes:
            - id: investigadores-route
              uri: lb://investigadores-service
              predicates:
                - Path=/api/investigadores/**
            - id: publicaciones-route
              uri: lb://publicaciones-service
              predicates:
                - Path=/api/publicaciones/**
            - id: consultas-route
              uri: lb://consultas-service
              predicates:
                - Path=/api/consultas/**
          globalcors:
            cors-configurations:
              '[/api/**]':
                allowed-origins: "http://localhost:5000"
                allowed-methods: GET,POST,PUT,DELETE
                allowed-headers: "*"

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
