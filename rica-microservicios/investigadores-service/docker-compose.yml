services:
  rica-db:
    image: postgres:16
    container_name: investigadores-postgres
    environment:
      POSTGRES_DB: rica
      POSTGRES_USER: rica
      POSTGRES_PASSWORD: rica
    ports:
      - "5432:5432"
    volumes:
      - investigadores-db-data:/var/lib/postgresql/data

volumes:
  investigadores-db-data:
