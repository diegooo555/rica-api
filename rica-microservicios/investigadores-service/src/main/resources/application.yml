server:
  port: 8080

spring:
  application:
    name: investigadores-service

  datasource:
    url: jdbc:postgresql://localhost:5432/rica
    username: rica
    password: rica

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: investigadores-service
      auto-offset-reset: earliest

  grpc:
    server:
      # publicaciones-service consulta aquí si un investigador existe
      port: 9090

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
