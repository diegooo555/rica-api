server:
  port: 8083

spring:
  application:
    name: consultas-service

  mongodb:
    # Base propia del lado de lectura: nada que ver con la base "rica" de publicaciones-service
    uri: mongodb://localhost:27017/rica_consultas

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Grupo nuevo = Kafka no recuerda nada: con earliest se reproducen todos los eventos (reconstrucción)
      group-id: consultas-service-v2
      auto-offset-reset: earliest

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # Cada línea de log lleva el servicio y el id de correlación de la petición
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
